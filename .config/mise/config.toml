# --- Cloud & Infrastructure CLIs ---
gh = "latest"
supabase = "latest"
railway = "latest"
vercel = "latest"
"npm:@withgraphite/graphite-cli" = "latest"

# --- High-Performance Compilation & Linting Binaries ---
ruff = "latest"
cargo-binstall = "latest"
sccache = "latest"
golangci-lint = "latest"
